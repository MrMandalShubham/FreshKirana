name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  verify:
    name: Format · Lint · Build · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The e2e suites skip themselves when no database is reachable, so CI must
    # provide one - otherwise they would silently never run.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: freshkirana
          POSTGRES_PASSWORD: freshkirana_local
          POSTGRES_DB: freshkirana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshkirana -d freshkirana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://freshkirana:freshkirana_local@localhost:5432/freshkirana

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Module boundary enforcement - spec 2.1.1, standing rule R2.
      - name: Check schema ownership
        run: npm run check:schemas

      - name: Build
        run: npm run build

      - name: Check module boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (e2e suites need a migrated database)
        run: npm run db:migrate

      - name: Test
        run: npm run test

      # An e2e suite that silently skips is worse than none: it reads as green.
      #
      # This used to run the whole suite a second time and grep for a skip
      # message. It no longer needs to: `testing/database.ts` skips only when
      # DATABASE_URL is absent and *throws* when it is set but unreachable, so a
      # broken database fails the run above rather than quietly passing it.
      # Asserting the variable is set is all that is left to check.
      - name: Assert e2e suites could run
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set, so every e2e suite skipped."
            exit 1
          fi

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: freshkirana
          POSTGRES_PASSWORD: freshkirana_local
          POSTGRES_DB: freshkirana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshkirana -d freshkirana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://freshkirana:freshkirana_local@localhost:5432/freshkirana

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Apply migrations
        run: npm run db:migrate

      # Re-running must be a no-op: deploys apply migrations before the new
      # version starts, and retries must be safe (2.15).
      - name: Re-apply migrations (idempotency)
        run: npm run db:migrate

      - name: Verify committed migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain packages/api/drizzle)" ]; then
            echo "::error::Schema changed without a committed migration. Run 'npm run db:generate'."
            git status --porcelain packages/api/drizzle
            exit 1
          fi

  web:
    name: Customer PWA builds within budget
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pages are force-dynamic, so no API is needed to build.
      - name: Build
        run: npm run build:web

      - name: Typecheck
        run: npm run typecheck -w @freshkirana/web-customer

      # §4.1 budgets 200 KB of gzipped initial JS on a mid-range Android over
      # 4G. Enforced, because a budget nobody measures is a wish — bundles only
      # grow by accident, one convenient dependency at a time.
      - name: Check bundle budget
        run: npm run check:budget

  container:
    name: Container builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: freshkirana
          POSTGRES_PASSWORD: freshkirana_local
          POSTGRES_DB: freshkirana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshkirana -d freshkirana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: freshkirana-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The P8.6 gate: dev auth must never run outside development. If this
      # ever passes, real authentication has silently gone missing.
      - name: Refuses to start in production without real auth
        run: |
          if docker run --rm -e NODE_ENV=production freshkirana-api:ci; then
            echo "::error::Container started with NODE_ENV=production while AUTH_MODE=dev. The P8.6 safety gate is broken."
            exit 1
          fi
          echo "Correctly refused to start."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply migrations
        run: npm ci && npm run build && npm run db:migrate
        env:
          DATABASE_URL: postgresql://freshkirana:freshkirana_local@localhost:5432/freshkirana

      - name: Boots and serves
        run: |
          docker run -d --name fk-ci --network host \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgresql://freshkirana:freshkirana_local@localhost:5432/freshkirana \
            freshkirana-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/metrics | grep -q 'http_requests_total'

          # Production images have no pino-pretty; logs must still be valid JSON.
          docker logs fk-ci 2>&1 | grep -q '"msg":"request completed"'

          docker rm -f fk-ci

  deploy-staging:
    name: Deploy to staging
    needs: [verify, migrations, container, web]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    env:
      REGION: asia-south1
      SERVICE: freshkirana-staging-api
      WEB_SERVICE: freshkirana-staging-web
      MIGRATE_JOB: freshkirana-staging-migrate
      SLA_SWEEP_JOB: freshkirana-staging-sla-sweep
      RESERVATION_SWEEP_JOB: freshkirana-staging-reservation-sweep

    steps:
      - uses: actions/checkout@v4

      # No service-account key exists to leak: GitHub mints a short-lived OIDC
      # token and GCP exchanges it, scoped to this repository only.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/freshkirana/api:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Migrations run to completion BEFORE the new revision serves traffic,
      # which is why they must stay backward-compatible for one release (2.15).
      - name: Apply migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --quiet
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$REGION" \
            --wait

      # Background jobs run the same image as the API. Without this they stay
      # pinned to whatever image they were created with, and a scheduled sweep
      # would quietly go on executing code from weeks ago.
      - name: Point scheduled jobs at the new image
        run: |
          gcloud run jobs update "$SLA_SWEEP_JOB" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --quiet

      - name: Deploy API revision
        run: |
          gcloud run deploy "$SERVICE" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --quiet

      # The storefront is a separate service (rule R8: every surface gets a GCP
      # home). Built after the API so a revision is never serving pages against
      # an API that has not migrated yet.
      - name: Build and push web image
        id: web_image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/freshkirana/web:${GITHUB_SHA}"
          docker build -f Dockerfile.web -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy web revision
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --region "$REGION" \
            --image "${{ steps.web_image.outputs.image }}" \
            --quiet

      - name: Resolve service URL
        id: url
        run: |
          echo "url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # A second auth, purely to mint an ID token for the service.
      #
      # `gcloud auth print-identity-token` cannot do this under Workload
      # Identity Federation - there is no service-account key to sign with, so
      # it fails with "No identity token can be obtained". The auth action
      # exchanges the OIDC token for one scoped to this exact audience instead.
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.url.outputs.url }}
          # Cloud Run IAM matches on the caller's email, so it must be present.
          id_token_include_email: true

      # The service is IAM-private, so this authenticates. An unauthenticated
      # curl would 403 - that is the point until P8.6 ships real auth.
      - name: Smoke test the deployed API
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ steps.idtoken.outputs.id_token }}" \
            "${{ steps.url.outputs.url }}/health" | tee /dev/stderr | grep -q '"status":"ok"'
          echo "API deployed: ${{ steps.url.outputs.url }}"

      - name: Resolve web URL
        id: web_url
        run: |
          echo "url=$(gcloud run services describe "$WEB_SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - id: web_idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.web_url.outputs.url }}
          id_token_include_email: true

      # Fetches a real page, not just /status: /status deliberately makes no API
      # call, so it stays green even when the storefront cannot reach the API.
      # Rendering the home page proves the whole chain, identity token included.
      - name: Smoke test the deployed storefront
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ steps.web_idtoken.outputs.id_token }}" \
            "${{ steps.web_url.outputs.url }}/en" | grep -q 'FreshKirana'
          echo "Storefront deployed: ${{ steps.web_url.outputs.url }}"
